server.port=8080

spring.datasource.url=${VANTIX_DB_URL:jdbc:postgresql://localhost:5432/vantix}
spring.datasource.username=${VANTIX_DB_USER:vantix_app}
spring.datasource.password=${VANTIX_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Las tablas se aplican desde BETA/BD con DBeaver; Flyway queda como referencia versionada.
spring.flyway.enabled=${VANTIX_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

vantix.rutas-permitidas=/home,/tmp
vantix.timeout-segundos=300
vantix.max-salida-bytes=1048576
vantix.bin.osqueryi=/usr/bin/osqueryi
vantix.bin.syft=/usr/local/bin/syft
vantix.bin.grype=/usr/local/bin/grype
vantix.bin.clamscan=/usr/bin/clamscan
vantix.bin.freshclam=/usr/bin/freshclam

# Sin valores por defecto: la app no arranca si no se definen estas variables.
vantix.jwt-secret=${VANTIX_JWT_SECRET}
vantix.admin-correo=${VANTIX_ADMIN_CORREO:admin@vantix.local}
vantix.admin-clave=${VANTIX_ADMIN_CLAVE}
vantix.admin-nombre=${VANTIX_ADMIN_NOMBRE:Administrador Vantix}
